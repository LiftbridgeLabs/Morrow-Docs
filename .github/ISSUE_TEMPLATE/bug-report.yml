name: Bug report
description: Report a reproducible problem with Morrow
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Anyone can read this issue, so do not include passwords, access tokens, API keys, private server addresses, or book titles you would rather keep private.

        A diagnostics file helps most. In Morrow's Settings, tap Export Diagnostics (under Support, or under About in versions before 1.10) and email it to support@liftbridgelabs.app, then mention here that you sent it. Please do not paste the file into this issue.
  - type: dropdown
    id: platform
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - iPhone
        - iPad
        - Apple TV
        - Apple Watch
        - CarPlay
        - Android phone or tablet
        - Android Auto
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Morrow version and build
      description: Shown in Settings > About.
      placeholder: "Example: 1.10 (95)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and operating system
      placeholder: "Example: iPhone 17 Pro, iOS 27.0, or Pixel 9, Android 16"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Server type
      options:
        - Audiobookshelf
        - BookOrbit
        - Grimmory
        - Booklore (older, connected as Grimmory)
        - On This Device (files on the phone)
        - Not server-related
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server version
      placeholder: Leave blank when not applicable
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Tap...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      multiple: true
      options:
        - At home, same network as the server
        - Away from home (remote access, VPN or tunnel)
        - Both
        - Not applicable
  - type: textarea
    id: logs
    attributes:
      label: Error text or other details
      description: Copy error messages exactly. Redact credentials, tokens, personal data, and private addresses before posting.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials, tokens, and other private information.
          required: true
